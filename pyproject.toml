[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jobapply-ai"
version = "1.0.0"
description = "AI job application email automation CLI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
jobapply = "app.cli.main:app"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["py.typed"]
